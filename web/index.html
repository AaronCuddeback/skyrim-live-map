<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e11">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Skyrim Live Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Live Map">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <div class="status" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>
    <div class="place">
      <div class="place-name" id="place-name">Skyrim</div>
      <div class="place-sub" id="place-sub"></div>
    </div>
  </header>

  <div class="compass" id="compass" hidden><canvas id="compass-canvas" aria-label="Compass"></canvas></div>

  <section class="player-card" id="player-card" hidden>
    <button class="pc-head" id="pc-toggle" aria-expanded="true" title="Show more or less">
      <span class="pc-name" id="pc-name">You</span>
      <span class="pc-level">Lv <b id="pc-level">–</b></span>
    </button>
    <div class="pc-sub"><span id="pc-race"></span><span id="pc-perks"></span></div>
    <div class="xp" title="Progress to next level"><div class="fill" id="pc-xp"></div></div>
    <div class="stat"><span class="label">HP</span><div class="bar"><div class="fill health" id="pc-health"></div></div><small id="pc-hp-text"></small></div>
    <div class="stat"><span class="label">MP</span><div class="bar"><div class="fill magicka" id="pc-magicka"></div></div><small id="pc-mp-text"></small></div>
    <div class="stat"><span class="label">SP</span><div class="bar"><div class="fill stamina" id="pc-stamina"></div></div><small id="pc-sp-text"></small></div>
    <div class="pc-buttons">
      <button id="open-inventory">🎒 Inventory</button>
      <button id="open-magic">✨ Magic</button>
    </div>
    <div class="pc-more">
      <div class="pc-grid">
        <span title="Gold">🪙 <b id="pc-gold">–</b></span>
        <span title="Carry weight">⚖ <b id="pc-carry">–</b></span>
        <span title="Dragon souls" id="pc-souls-wrap" hidden>🐉 <b id="pc-souls"></b></span>
      </div>
      <div class="pc-eq" id="pc-eq"></div>
      <div class="pc-flags" id="pc-flags"></div>
      <div class="pc-foot"><span id="pc-time"></span><span id="pc-coords"></span></div>
    </div>
  </section>

  <div class="fabs">
    <button class="fab" id="btn-fullscreen" title="Full screen" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="fab" id="btn-follow" title="Follow player" aria-pressed="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="12" cy="12" r="7" fill="none" stroke-width="2"/></svg>
    </button>
    <button class="fab" id="btn-view" title="Toggle top-down / 3D">
      <span id="view-label">3D</span>
    </button>
    <button class="fab" id="btn-style" title="Change map style">
      <svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14 M15 6v14" fill="none" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
    <button class="fab" id="btn-north" title="Face north">
      <svg viewBox="0 0 24 24"><path d="M12 3l5 16-5-4-5 4z"/></svg>
    </button>
    <button class="fab" id="btn-panel" title="Locations & nearby">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>

  <aside class="panel" id="panel">
    <div class="panel-grip" id="panel-grip"></div>
    <input id="search" type="search" placeholder="Search locations…" autocomplete="off" spellcheck="false">
    <ul class="results" id="results"></ul>
    <h3>Modlist</h3>
    <select id="map-select" aria-label="Which modlist's map to show"></select>
    <div class="hint" id="map-current"></div>
    <div class="map-build"><span class="hint" id="map-build"></span><button id="map-rebuild" title="Build this map again from your modlist, after you've changed or updated it">Rebuild map</button></div>
    <h3>Map style</h3>
    <div class="segmented" id="styles"></div>
    <div class="chips" id="filters"></div>
    <h3>Quests <span class="count" id="quest-count"></span></h3>
    <ul class="quests" id="quests"><li class="empty">Waiting for the game…</li></ul>
    <h3>Nearby <span class="count" id="nearby-count"></span></h3>
    <ul class="nearby" id="nearby"><li class="empty">No one around.</li></ul>
    <details class="legend" id="legend">
      <summary>Legend</summary>
      <div id="legend-body"></div>
    </details>
  </aside>

  <section class="interior" id="interior" hidden>
    <header class="interior-head">
      <div>
        <div class="interior-title">Inside</div>
        <div class="interior-name" id="interior-name"></div>
      </div>
      <div class="interior-zoom">
        <button id="imap-out" aria-label="Zoom out">−</button>
        <button id="imap-in" aria-label="Zoom in">+</button>
      </div>
    </header>
    <div class="imap" id="imap"><div class="imap-status" id="imap-status" hidden></div></div>
    <canvas id="radar" width="440" height="440"></canvas>
  </section>

  <div class="dest" id="dest" hidden title="Tap to show on the map">
    <span class="dest-arrow" id="dest-arrow">➤</span>
    <span class="dest-text"><b id="dest-name"></b><small id="dest-info"></small></span>
    <button class="dest-clear" id="dest-clear" aria-label="Clear destination">✕</button>
  </div>

  <section class="sheet" id="sheet" hidden aria-label="Character sheet">
    <header class="sheet-head">
      <div class="sheet-tabs">
        <button data-tab="inventory" aria-pressed="true">🎒 Inventory</button>
        <button data-tab="magic" aria-pressed="false">✨ Magic</button>
      </div>
      <button class="sheet-close" id="sheet-close" aria-label="Close">✕</button>
    </header>
    <div class="sheet-tools">
      <input id="sheet-search" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
      <select id="sheet-sort" aria-label="Sort by">
        <option value="name">Equipped, A–Z</option>
        <option value="value">Value</option>
        <option value="weight">Weight</option>
        <option value="ratio">Value per weight</option>
      </select>
    </div>
    <div class="chips sheet-cats" id="sheet-cats"></div>
    <div class="sheet-summary" id="sheet-summary"></div>
    <ul class="sheet-list" id="sheet-list"></ul>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <div class="loading" id="loading"><div class="sigil"></div><div>Charting Skyrim…</div><small id="loading-detail"></small></div>

  <script type="module" src="app.js"></script>
</body>
</html>
