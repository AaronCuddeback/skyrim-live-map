; Skyrim Live Map - SKSE plugin settings
; Lives next to SkyrimLiveMap.dll in Data\SKSE\Plugins

[Relay]
; How the game talks to the relay server (server/server.js):
;   pipe = relay on this same PC (default). Uses a Windows named pipe, which is not
;          network traffic, so ReShade keeps its add-ons (DLSS etc.) enabled.
;   udp  = relay on another computer at Host:Port. ReShade's standard build will
;          see this as network activity and disable add-ons.
Transport=pipe
PipeName=SkyrimLiveMap
; Only used when Transport=udp: the LAN IP of the PC running the relay.
Host=127.0.0.1
Port=27015

[Telemetry]
; Player updates per second
PlayerHz=10
; Nearby actor (mob) updates per second. 0 disables actor tracking.
ActorHz=2
; Max actors sent per update
MaxActors=120

[Hotkeys]
; Keys that move the web map while you play (every open map follows them). They're
; ignored in menus and the console. Values are DirectInput scan codes, as in MCMs;
; 0 = unbound. Easier: change them in the in-game menu (SKSE Menu Framework, F10).
Enabled=1
; Hold to zoom / pan. Defaults are on the number pad: + - 8 2 4 6
ZoomIn=78
ZoomOut=74
PanUp=72
PanDown=80
PanLeft=75
PanRight=77
; Press once. Num 5 = recenter on you, Num 0 = 2D/3D, Num . = next map style
Recenter=76
ToggleView=82
NextStyle=83
